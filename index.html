        body {

        #scroll-viewport {
            width: 100vw;
            height: 100vh;

            cursor: grab;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-user-select: none; /* Safari */
  -ms-user-select: none;    /* IE/Edge */

            display: none;
        }
        #scroll-viewport:active {
            cursor: grabbing;
        }
        #giant-canvas {
            position: relative;
            width: 4000px;  
            height: 4000px; 
            background-size: 40px 40px; 
        }
        .project-card {
            position: absolute;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s, scale 0.6s;

        }

}

                const isClickable = !project.disablePanel;
                card.className = `project-card overflow-hidden group ${isClickable ? 'cursor-pointer' : 'cursor-default'}`;
                
                const pixelWidth = project.wUnits * CELL_SIZE + (project.wUnits - 1) * GAP;
                const pixelHeight = project.hUnits * CELL_SIZE + (project.hUnits - 1) * GAP;
                
                card.style.width = `${pixelWidth}px`;
                card.style.height = `${pixelHeight}px`;
                card.setAttribute('data-id', project.id);
                
                card.innerHTML = `
                    <img src="${project.image}" alt="${project.title}" class="w-full h-full object-contain">
                    <div class="absolute inset-0 p-6 flex flex-col justify-end pointer-events-none">
                        <h3 class="text-lg font-semibold tracking-wide text-transparent transition-colors duration-300">${project.title}</h3>
                    </div>
                `;

                canvas.appendChild(card);

                items.push({
                    element: card,
                    id: project.id,
                    pinned: project.pinned,
                    category: project.category,
                    tags: project.tags,
                    w: project.wUnits,
                    h: project.hUnits,
                    gridX: 0,
                    gridY: 0,
                    visible: true
                });
            });
        }

        // --- LAYOUT ENGINE (RESPONDS TO CAT + SUBTAG) ---
      function generateClusterLayout() {
    const occupiedSlots = new Set();

    const claimSlots = (item, gx, gy) => {
        for (let x = 0; x < item.w; x++) {
            for (let y = 0; y < item.h; y++) {
                occupiedSlots.add(`${gx + x},${gy + y}`);
            }
        }
    };

    const isAreaFree = (item, gx, gy) => {
        for (let x = 0; x < item.w; x++) {
            for (let y = 0; y < item.h; y++) {
                if (occupiedSlots.has(`${gx + x},${gy + y}`)) return false;
            }
        }
        return true;
    };

    // 1. Separate the active items
    const activeItems = items.filter(item => item.visible);
    
    // 2. Find if there's a pinned project in the data array
    const pinnedProject = activeItems.find(item => {
        const rawData = projectsData.find(p => p.id === item.id);
        return rawData && rawData.pinned === true;
    });

    // 3. If a pinned project exists and is visible, lock it to the absolute center (0,0)
    if (pinnedProject) {
        // Calculate offsets so the middle of the card aligns with (0,0)
        const targetGridX = 0 - Math.floor(pinnedProject.w / 2);
        const targetGridY = 0 - Math.floor(pinnedProject.h / 2);
        
        pinnedProject.gridX = targetGridX;
        pinnedProject.gridY = targetGridY;
        claimSlots(pinnedProject, targetGridX, targetGridY);
    }

    // 4. Shuffle the rest of the unpinned projects so they form a natural cloud around the center
    const remainingItems = activeItems.filter(item => item !== pinnedProject);
    const shuffledItems = [...remainingItems].sort(() => Math.random() - 0.5);

    // 5. Run the standard clustering loop for the remaining items
    shuffledItems.forEach(item => {
        let radius = 0;
        let foundSpot = false;

        while (!foundSpot) {
            for (let x = -radius; x <= radius && !foundSpot; x++) {
                for (let y = -radius; y <= radius && !foundSpot; y++) {
                    if (Math.abs(x) === radius || Math.abs(y) === radius) {
                        const targetGridX = x - Math.floor(item.w / 2);
                        const targetGridY = y - Math.floor(item.h / 2);

                        if (isAreaFree(item, targetGridX, targetGridY)) {
                            item.gridX = targetGridX;
                            item.gridY = targetGridY;
                            claimSlots(item, targetGridX, targetGridY);
                            foundSpot = true;
                        }
                    }
                }
            }
            radius++;
        }
    });

    renderPositions();
}

        function renderPositions() {
    let canvasCenterX = canvas.clientWidth / 2;
    let canvasCenterY = canvas.clientHeight / 2;

    // 1. Find if there is an active pinned item
    const pinnedItem = items.find(item => {
        const rawData = projectsData.find(p => p.id === item.id);
        return item.visible && rawData && rawData.pinned === true;
    });

    // 2. GLOBAL OFFSET CORRECTOR:
    // If a pinned item exists, calculate its exact mathematical center offset 
    // from the grid anchor point and shift the global center lines.
    if (pinnedItem) {
        const itemPixelWidth = pinnedItem.w * CELL_SIZE + (pinnedItem.w - 1) * GAP;
        const itemPixelHeight = pinnedItem.h * CELL_SIZE + (pinnedItem.h - 1) * GAP;

        // Find how far the geometric center of the card is from its top-left slot anchor
        const halfWidthOfCard = itemPixelWidth / 2;
        const halfHeightOfCard = itemPixelHeight / 2;

        // Shift the canvas origin so this card's geometric center aligns with absolute (0,0)
        canvasCenterX = canvasCenterX - (pinnedItem.gridX * (CELL_SIZE + GAP)) - halfWidthOfCard;
        canvasCenterY = canvasCenterY - (pinnedItem.gridY * (CELL_SIZE + GAP)) - halfHeightOfCard;
    }

    // 3. Render all visible items using the new globally corrected center
    items.forEach(item => {
        const posX = canvasCenterX + (item.gridX * (CELL_SIZE + GAP));
        const posY = canvasCenterY + (item.gridY * (CELL_SIZE + GAP));

        // Reset left/top coordinates to pure standard tracking positions
        item.element.style.left = '0px';
        item.element.style.top = '0px';

       if (item.visible) {
        const baseTransform = `translate3d(${posX}px, ${posY}px, 0)`;
        
        // Save the coordinates so the CSS hover state can read them
        item.element.style.setProperty('--current-transform', baseTransform);
        item.element.style.transform = `${baseTransform} scale(1)`;
        item.element.style.opacity = '1';
        item.element.style.pointerEvents = 'auto';
    } else {
        const baseTransform = `translate3d(${posX}px, ${posY}px, 0)`;
        item.element.style.transform = `${baseTransform} scale(0)`;
        item.element.style.opacity = '0';
        item.element.style.pointerEvents = 'none';
    }
    });
}

        function jumpToCenter(smooth = true) {
            const scrollX = (canvas.clientWidth / 2) - (window.innerWidth / 2);
            const strokeY = (canvas.clientHeight / 2) - (window.innerHeight / 2);

            viewPort.scrollTo({
                top: strokeY,
                left: scrollX,
                behavior: smooth ? 'smooth' : 'auto'
            });
        }

        // --- DRAG MOUSE LOGIC ---
        let isDragging = false;
        let startX, startY, scrollLeft, scrollTop;
        let wasDragged = false;

        viewPort.addEventListener('mousedown', (e) => {
            if(e.target.closest('#nav-tabs') || e.target.closest('#recenter-btn') || e.target.closest('#side-panel') || e.target.closest('#active-tag-indicator')) return;
            isDragging = true;
            wasDragged = false;
            startX = e.pageX - viewPort.offsetLeft;
            startY = e.pageY - viewPort.offsetTop;
            scrollLeft = viewPort.scrollLeft;
            scrollTop = viewPort.scrollTop;
            viewPort.style.scrollBehavior = 'auto';
        });

        viewPort.addEventListener('mouseleave', () => { isDragging = false; });
        viewPort.addEventListener('mouseup', () => { isDragging = false; });

        viewPort.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.pageX - viewPort.offsetLeft;
            const y = e.pageY - viewPort.offsetTop;
            const walkX = (x - startX) * 1.5; 
            const walkY = (y - startY) * 1.5;
            if (Math.abs(x - startX) > 5 || Math.abs(y - startY) > 5) wasDragged = true;
            viewPort.scrollLeft = scrollLeft - walkX;
            viewPort.scrollTop = scrollTop - walkY;
        });

        // --- SIDE PANEL MOUNT WITH REWRITTEN CLICKABLE TAGS ---
        function openProjectPanel(projectId) {
            const project = projectsData.find(p => String(p.id) === String(projectId));
            if (!project) return;

            
            if (!project || project.disablePanel === true) return;

            document.getElementById('panel-category').innerText = Array.isArray(project.category) ? project.category.join(' + ') : project.category;
            document.getElementById('panel-title').innerText = project.title;
            document.getElementById('panel-description').innerText = project.desc;
            document.getElementById('panel-image').src = project.image;
            document.getElementById('panel-image').alt = project.title;

const galleryWrapper = document.getElementById('panel-gallery');
    const galleryHeading = document.getElementById('gallery-heading');
    galleryWrapper.innerHTML = ''; // Clear out past images safely

    // Check if the project has extra gallery images
    // AFTER (The multimedia media check version):
if (project.gallery && project.gallery.length > 0) {
    galleryHeading.classList.remove('hidden'); // Show the "Project Gallery" heading
    
    project.gallery.forEach(assetUrl => {
        // Detect if the string ends in a video extension
        const isVideo = assetUrl.endsWith('.mp4') || assetUrl.endsWith('.webm') || assetUrl.endsWith('.mov');

        if (isVideo) {
    // 1. Create a wrapper container forced to have a solid black background
    const videoContainer = document.createElement('div');
    videoContainer.className = "w-full rounded-lg bg-black overflow-hidden flex items-center justify-center";

    // 2. Create the Video Player
    const videoElement = document.createElement('video');
    videoElement.src = assetUrl;
    
    // Changing object-cover to object-contain keeps the video aspect ratio perfect 
    // against the black wrapper background without cropping it
    videoElement.className = "w-full h-auto object-contain max-h-[70vh]";
    
    // Native controls setups
    videoElement.controls = true;
    videoElement.playsInline = true;
    videoElement.preload = "metadata";
    
    // Put the video in the black box, and the black box into the gallery
    videoContainer.appendChild(videoElement);
    galleryWrapper.appendChild(videoContainer);
} else {
            // 2. Fall back to your standard image layout if it's a regular photo
            const imgElement = document.createElement('img');
            imgElement.src = assetUrl;
            imgElement.className = "w-full rounded-lg object-cover bg-white";
            imgElement.loading = "lazy";
            
            galleryWrapper.appendChild(imgElement);
        }
    });
} else {
        galleryHeading.classList.add('hidden'); // Hide heading if no extra images exist
    }

            const tagsWrapper = document.getElementById('panel-tags');
            tagsWrapper.innerHTML = '';
            
            project.tags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = "bg-black/5 hover:bg-black/10 border border-black/5 text-zinc-700 hover:text-black text-xs px-3 py-1.5 rounded-md tracking-wide font-medium transition-all text-left";
                btn.innerText = tag;
                
                // CLICK EVENT FOR SPECIFIC TAG FILTER
                btn.addEventListener('click', () => {
                    filterBySubTag(tag);
                    closeProjectPanel();
                });

                tagsWrapper.appendChild(btn);
            });

            sidePanel.classList.remove('translate-x-full');
        }

        function closeProjectPanel() {
            sidePanel.classList.add('translate-x-full');
        }

        canvas.addEventListener('click', (e) => {
            const card = e.target.closest('.project-card');
            if (!card || wasDragged) return;
            openProjectPanel(card.getAttribute('data-id'));
        });

        document.getElementById('close-panel-btn').addEventListener('click', closeProjectPanel);

        // --- INTERACTIVE TAG & CATEGORY CONTROLLER ---
function updateCombinedFilters() {
    items.forEach(item => {
        // 1. Fetch the original master data to check the title
        const project = projectsData.find(p => String(p.id) === String(item.id));
        if (!project) return;

        // 2. Existing Category and Sub-Tag Rules
        const matchesCategory = (currentCategory === 'all' || 
            (Array.isArray(item.category) ? item.category.includes(currentCategory) : item.category === currentCategory));
    
        // 3. New Search Rule: Does title or tags include the search string?
        const matchesSearch = !currentSearchQuery || 
            project.title.toLowerCase().includes(currentSearchQuery) || 
            project.tags.some(tag => tag.toLowerCase().includes(currentSearchQuery));

        // 4. Combined Filter Rules
        if (item.pinned === true) {
            item.visible = true; // Pinned stays forever
        } else if (currentSubTag) {
            // If a HUD sub-tag is active, match sub-tag AND search query
            item.visible = item.tags.includes(currentSubTag) && matchesSearch;
        } else {
            // Otherwise, match main tab category AND search query
            item.visible = matchesCategory && matchesSearch;
        }
    });

    generateClusterLayout();
    
    // Show HUD chip if a sub-tag filter is actively blocking layout nodes
    if (currentSubTag) {
        activeTagText.innerText = `${currentSubTag}`;
        activeTagIndicator.classList.remove('hidden');
        activeTagIndicator.classList.add('flex');
    } else {
        activeTagIndicator.classList.add('hidden');
        activeTagIndicator.classList.remove('flex');
    }
    
    setTimeout(() => jumpToCenter(true), 150);
}
        

        function filterCategory(category) {
            currentCategory = category;
            updateCombinedFilters();
        }

        function filterBySubTag(tagName) {
            currentSubTag = tagName;
            updateCombinedFilters();
        }

        // Clear sub-tags action
        document.getElementById('clear-tag-btn').addEventListener('click', () => {
            currentSubTag = null;
            updateCombinedFilters();
        });

        document.getElementById('nav-tabs').addEventListener('click', (e) => {
            const btn = e.target.closest('.nav-btn');
            if (!btn) return;

            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('bg-[#89F336]', 'text-white');
                b.classList.add('text-zinc-500', 'hover:text-black');
            });
            btn.classList.add('bg-[#89F336]', 'text-white');
            btn.classList.remove('text-zinc-500', 'hover:text-black');

            currentSubTag = null; // Automatically drop deep-tags if main menu tab shifts
            filterCategory(btn.getAttribute('data-category'));
            closeProjectPanel();
        });

        document.getElementById('recenter-btn').addEventListener('click', () => {
            viewPort.style.scrollBehavior = 'smooth'; 
            jumpToCenter(true);
        });

        // Initialize Base Project Execution Layers
        createDOM();
        filterCategory('all');
        
        window.addEventListener('load', () => jumpToCenter(false));
        window.addEventListener('resize', () => jumpToCenter(false));
    </script>
